# Google GraphCast_small inference contract.
#
# This file describes the checkpoint/data contract needed by the
# Google-Small-compatible PyTorch inference path. It intentionally does not
# match external/GraphCast_pytorch-main/config/data_config.yaml, which is for
# the compact training-oriented PyTorch implementation.

source:
  checkpoint: data/raw/wcy_graphcast_reference/graphcast_params_GraphCast_small.npz
  checkpoint_sha256: e9438d8ad31ca6e1d3397a33b2508f4bbb6ec16aed84629f9a64712bf756bc29
  license: CC-BY-NC-SA-4.0

model_config:
  resolution: 1.0
  mesh_size: 5
  latent_size: 512
  gnn_msg_steps: 16
  hidden_layers: 1
  radius_query_fraction_edge_length: 0.6
  mesh2grid_edge_normalization_factor: 0.6180338738074472

task_config:
  input_duration: 12h
  pressure_levels: [50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000]

  # Original checkpoint order. This is useful for config comparisons, but it is
  # not the channel stacking order used by model_utils.dataset_to_stacked().
  input_variables:
    - 2m_temperature
    - mean_sea_level_pressure
    - 10m_v_component_of_wind
    - 10m_u_component_of_wind
    - total_precipitation_6hr
    - temperature
    - geopotential
    - u_component_of_wind
    - v_component_of_wind
    - vertical_velocity
    - specific_humidity
    - toa_incident_solar_radiation
    - year_progress_sin
    - year_progress_cos
    - day_progress_sin
    - day_progress_cos
    - geopotential_at_surface
    - land_sea_mask

  target_variables:
    - 2m_temperature
    - mean_sea_level_pressure
    - 10m_v_component_of_wind
    - 10m_u_component_of_wind
    - total_precipitation_6hr
    - temperature
    - geopotential
    - u_component_of_wind
    - v_component_of_wind
    - vertical_velocity
    - specific_humidity

  forcing_variables:
    - toa_incident_solar_radiation
    - year_progress_sin
    - year_progress_cos
    - day_progress_sin
    - day_progress_cos

  static_variables:
    - geopotential_at_surface
    - land_sea_mask

variables:
  atmospheric:
    - temperature
    - geopotential
    - u_component_of_wind
    - v_component_of_wind
    - vertical_velocity
    - specific_humidity
  surface_inputs:
    - 2m_temperature
    - mean_sea_level_pressure
    - 10m_v_component_of_wind
    - 10m_u_component_of_wind
    - total_precipitation_6hr
  surface_targets:
    - 2m_temperature
    - mean_sea_level_pressure
    - 10m_v_component_of_wind
    - 10m_u_component_of_wind
    - total_precipitation_6hr
  forcing:
    - toa_incident_solar_radiation
    - year_progress_sin
    - year_progress_cos
    - day_progress_sin
    - day_progress_cos
  static:
    - geopotential_at_surface
    - land_sea_mask

stacking:
  preserved_dims: [batch, lat, lon]
  data_var_order_rule: sorted_dataset_data_var_names
  input_time_steps: 2
  target_time_steps: 1
  target_time_forcing_steps: 1

  # dataset_to_stacked(inputs) order, i.e. sorted(input_variables).
  input_data_var_order:
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
    - 2m_temperature
    - day_progress_cos
    - day_progress_sin
    - geopotential
    - geopotential_at_surface
    - land_sea_mask
    - mean_sea_level_pressure
    - specific_humidity
    - temperature
    - toa_incident_solar_radiation
    - total_precipitation_6hr
    - u_component_of_wind
    - v_component_of_wind
    - vertical_velocity
    - year_progress_cos
    - year_progress_sin

  # dataset_to_stacked(forcings) order, i.e. sorted(forcing_variables).
  forcing_data_var_order:
    - day_progress_cos
    - day_progress_sin
    - toa_incident_solar_radiation
    - year_progress_cos
    - year_progress_sin

  # stacked_to_dataset(target_template) order, i.e. sorted(target_variables).
  target_data_var_order:
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
    - 2m_temperature
    - geopotential
    - mean_sea_level_pressure
    - specific_humidity
    - temperature
    - total_precipitation_6hr
    - u_component_of_wind
    - v_component_of_wind
    - vertical_velocity

  variable_dims:
    atmospheric_inputs: [batch, time, lat, lon, level]
    surface_inputs: [batch, time, lat, lon]
    forcing_inputs: [batch, time, lat, lon]
    static_inputs: [batch, lat, lon]
    atmospheric_targets: [batch, time, lat, lon, level]
    surface_targets: [batch, time, lat, lon]

channel_contract:
  atmospheric_input_channels: 156
  surface_input_channels: 10
  forcing_input_channels: 10
  static_input_channels: 2
  target_time_forcing_channels: 5
  model_input_channels: 183
  grid_node_geo_channels: 3
  grid_node_embed_input_channels: 186
  mesh_node_embed_input_channels: 186
  edge_feature_channels: 4
  model_output_channels: 83
