# Shared tooling config for the AI4S models monorepo.
# Per-model dependencies still live in each model's own folder
# (requirements.txt / environment.yml / pyproject.toml).

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# A pragmatic default set: pyflakes (F), pycodestyle (E/W), isort (I),
# pyupgrade (UP), flake8-bugbear (B), comprehensions (C4).
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
  "E501",  # line length is handled by the formatter
]

[tool.ruff.format]
quote-style = "double"
