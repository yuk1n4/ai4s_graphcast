# Pre-commit hooks for the AI4S models monorepo.
# Install once with:  pip install pre-commit && pre-commit install
# Run on everything:   pre-commit run --all-files
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      # Guard against committing checkpoints / datasets (see ai4s/README.md).
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.2
    hooks:
      # Lint, with autofix.
      - id: ruff
        args: [--fix]
      # Format (Black-compatible).
      - id: ruff-format
